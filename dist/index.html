<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Draws</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    input { width: 120px; }
    .error { color: red; margin-top: 1em; }
    .success { color: green; margin-top: 1em; }
  </style>
</head>
<body>
  <h2>Create Draws</h2>

  <div>
    <label>Set same amount for all:</label>
    <input id="allAmount" type="number" placeholder="25000">
    <button onclick="applyToAll()">Apply to all</button>
  </div>

  <table id="loansTable">
    <thead>
      <tr><th>Loan #</th><th>Requested Amount</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div style="margin-top:10px;">
    <button onclick="createDraws()">Create Draws</button>
  </div>

  <div id="output"></div>

  <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.umd.js"></script>
  <script>
    const monday = window.mondaySdk();
    // Debug: always log context events
    monday.listen("context", res => {
      console.log("DEBUG full context (listen):", res.data);
    });

    // Debug: fetch context once at startup
    monday.get("context").then(res => {
      console.log("DEBUG context (get):", res.data);
    });
    const API_BASE = window.location.origin + "/api";
    const AUTH_HEADER = { "Authorization": "Bearer supersecret" };

    let selectedItems = [];

    monday.listen("context", async res => {
      console.log("DEBUG context:", res.data);
      const context = res.data;
      let ids = [];
      if (context.selectedPulseIds && context.selectedPulseIds.length) {
        ids = context.selectedPulseIds;
      } else if (context.selectedPulseIdsV2 && context.selectedPulseIdsV2.length) {
        ids = context.selectedPulseIdsV2;
      } else if (context.inputValues && context.inputValues.pulseIds) {
        ids = context.inputValues.pulseIds;
      }

      if (ids.length) {
        selectedItems = ids.map(id => ({ id, requested_amount: null }));
        renderTable();
        // fetch item names
        const resp = await fetch(API_BASE + "/item-names", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...AUTH_HEADER },
          body: JSON.stringify({ item_ids: ids })
        });
        const data = await resp.json();
        selectedItems.forEach(item => {
          const found = data.items.find(i => i.id == item.id);
          if (found) item.loan_number = found.name;
        });
        renderTable();
      }
    });

    function renderTable() {
      const tbody = document.querySelector("#loansTable tbody");
      tbody.innerHTML = "";
      selectedItems.forEach((item, idx) => {
        const tr = document.createElement("tr");
        const tdLoan = document.createElement("td");
        tdLoan.textContent = item.loan_number || item.id;
        const tdAmt = document.createElement("td");
        const inp = document.createElement("input");
        inp.type = "number";
        inp.value = item.requested_amount || "";
        inp.oninput = e => { selectedItems[idx].requested_amount = parseFloat(e.target.value) || null; };
        tdAmt.appendChild(inp);
        tr.appendChild(tdLoan);
        tr.appendChild(tdAmt);
        tbody.appendChild(tr);
      });
    }

    function applyToAll() {
      const val = parseFloat(document.getElementById("allAmount").value);
      if (isNaN(val)) return;
      selectedItems.forEach(i => i.requested_amount = val);
      renderTable();
    }

    async function createDraws() {
      try {
        const payload = { items: selectedItems.map(i => ({ item_id: i.id, requested_amount: i.requested_amount })) };
        const resp = await fetch(API_BASE + "/create-from-selection", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...AUTH_HEADER },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        document.getElementById("output").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      } catch (err) {
        document.getElementById("output").innerHTML = "<div class='error'>" + err + "</div>";
      }
    }
  </script>
</body>
</html>
